
[webserver]
port = ":19091"

[cache]
type="file"
basepath = "D:/temp/tegola-cache"
max_zoom="22"

# PostGIS数据提供者配置
[[providers]]
name = "inference_database"
type = "mvt_postgis"
uri = "postgres://postgres:postgres@127.0.0.1:35432/rjxt?sslmode=disable&pool_max_conns=20&pool_min_conns=5"
srid = 3857

# 启用连接池复用
pool_min_idle = 5
pool_max_idle = 20
pool_max_lifetime = "300s"
# 地面图层配置
# 建筑物图层配置
[[providers.layers]]
name = "!TASKID!"
srid = 3857

sql = """
SELECT ST_AsMVTGeom(!GEOM_COLUMN!, !BBOX!, 4096, 256, true) AS geom, !COLUMNS!
FROM !TASKID!
WHERE !GEOM_COLUMN! && !BBOX!
"""

# 地图配置
[[maps]]
name = "inference_database"     # 地图名称（用于URL：/maps/inference_database）
attribution = "Tegola Vector Tiles"  # 版权信息


# 配置地图参数
[[maps.params]]
name = "task_id"
token = "!TASKID!"
type = "string"

# 地图中的动态图层
[[maps.layers]]
provider_layer = "inference_database.!TASKID!"

